name: 优酷-L1（CUPS+HP打印机）
on: [workflow_dispatch]
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: 安装依赖（仅CUPS+基础编译）
        run: |
          sudo apt update -y
          sudo apt install -y build-essential git unzip libtool-bin automake autoconf pkg-config libssl-dev libusb-1.0-0-dev libcups2-dev libcupsimage2-dev wget
          sudo apt clean -y
      - name: 克隆源码
        run: |
          git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}.git /opt/rt-n56u
          cd /opt/rt-n56u/toolchain-mipsel && sh dl_toolchain.sh
          mkdir -p /opt/images
      - name: 扩容分区（适配CUPS体积）
        run: |
          cd /opt/rt-n56u/trunk
          sed -i 's/SIZ=0x80000/SIZ=0x1800000/g' configs/boards/YK-L1/kernel-3.4.x.config
          sed -i 's/size_etc="6M"/size_etc="24M"/g' user/scripts/dev_init.sh
      - name: 配置固件（仅启用CUPS+USB）
        run: |
          cd /opt/rt-n56u/trunk
          cp configs/templates/YK-L1.config .config
          # 启用核心功能
          sed -i 's/CONFIG_FIRMWARE_ENABLE_USB=n/CONFIG_FIRMWARE_ENABLE_USB=y/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_USB_PRINTER=n/CONFIG_FIRMWARE_INCLUDE_USB_PRINTER=y/g' .config
          echo "CONFIG_FIRMWARE_INCLUDE_CUPS=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_CUPS_FILTERS=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_USB_AUTOMOUNT=y" >> .config
          # 禁用所有冲突功能
          echo "CONFIG_FIRMWARE_INCLUDE_VLMCSD=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_N2N_V2=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config
      - name: 编译固件
        run: |
          cd /opt/rt-n56u/trunk
          sudo ./clear_tree && sudo ./build_firmware_modify YK-L1 1
          sudo mv images/*.trx /opt/images/
      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: CUPS-$(date +%Y%m%d)
          files: /opt/images/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
