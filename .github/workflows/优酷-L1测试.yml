name: 优酷-L1（CUPS+VNT+SMB+TF卡）
on: [workflow_dispatch]
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@master

      - name: 2. 安装完整依赖（解决所有编译冲突+CUPS/TF卡支持）
        run: |
          sudo apt update -y
          # 原有基础依赖 + CUPS依赖 + 国际化工具（解决mksquashfs报错） + VNT/SMB依赖
          sudo apt install -y build-essential git unzip libtool-bin automake autoconf pkg-config \
          libssl-dev libusb-1.0-0-dev libcups2-dev libcupsimage2-dev wget gettext gettext-base \
          libsodium-dev libsmbclient-dev
          sudo apt clean -y

      - name: 3. 克隆源码并下载工具链
        run: |
          git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}.git /opt/rt-n56u
          cd /opt/rt-n56u/toolchain-mipsel
          # 工具链下载超时重试，确保下载成功
          sh dl_toolchain.sh || sh dl_toolchain.sh
          mkdir -p /opt/images

      - name: 4. 扩容分区（适配CUPS+TF卡功能体积）
        run: |
          cd /opt/rt-n56u/trunk
          # 扩容存储分区到24M（适配CUPS，不改动原有稳定逻辑）
          sed -i 's/SIZ=0x80000/SIZ=0x1800000/g' configs/boards/YK-L1/kernel-3.4.x.config
          sed -i 's/size_etc="6M"/size_etc="24M"/g' user/scripts/dev_init.sh

      - name: 5. 配置固件（保留VNT/SMB，添加CUPS+TF卡驱动）
        run: |
          cd /opt/rt-n56u/trunk
          cp configs/templates/YK-L1.config .config

          # ========== 原有功能保留（VNT+SMB） ==========
          sed -i 's/CONFIG_FIRMWARE_ENABLE_USB=n/CONFIG_FIRMWARE_ENABLE_USB=y/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_USB_PRINTER=n/CONFIG_FIRMWARE_INCLUDE_USB_PRINTER=y/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_USB_AUTOMOUNT=n/CONFIG_FIRMWARE_INCLUDE_USB_AUTOMOUNT=y/g' .config

          # ========== 新增CUPS（HP打印机核心） ==========
          echo "CONFIG_FIRMWARE_INCLUDE_CUPS=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_CUPS_FILTERS=y" >> .config

          # ========== 补充TF卡识别驱动（优酷L1 SPI接口） ==========
          echo "CONFIG_FIRMWARE_INCLUDE_KMOD_MMC=y" >> .config        # MMC/TF卡核心驱动
          echo "CONFIG_FIRMWARE_INCLUDE_KMOD_MMC_SPI=y" >> .config  # SPI-TF卡驱动（适配优酷L1）
          echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> .config             # TF卡常用FAT32格式
          echo "CONFIG_FIRMWARE_ENABLE_EXFAT=y" >> .config           # TF卡exFAT格式
          echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> .config            # TF卡EXT4格式

          # ========== 禁用冲突功能（保留原有逻辑） ==========
          echo "CONFIG_FIRMWARE_INCLUDE_VLMCSD=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_N2N_V2=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config

      - name: 6. 彻底修复mksquashfs编译错误（禁用国际化）
        run: |
          cd /opt/rt-n56u/trunk/tools/mksquashfs_xz/xz-5.2.4
          ./configure --disable-nls  # 强制禁用国际化，跳过翻译文件生成
          rm -rf po                   # 删除po目录，双重保险

      - name: 7. 编译固件（保留原有稳定逻辑）
        run: |
          cd /opt/rt-n56u/trunk
          sudo ./clear_tree
          sudo ./build_firmware_modify YK-L1 1
          # 验证核心功能文件是否编译成功
          ls -lh build_dir/target-mipsel_24kec+dsp_uClibc-0.9.33.2/root-ramips/usr/bin | grep -E "cupsd|smbd|vnt-cli"
          # 移动固件到输出目录
          sudo mv images/*.trx /opt/images/

      - name: 8. 发布固件（含版本标识）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: CUPS-VNT-SMB-TF-$(date +%Y%m%d)
          files: /opt/images/*
          body: |
            ### 优酷L1 Padavan固件
            - 集成功能：CUPS（HP打印机）、VNT、SMB、TF卡识别
            - 默认后台：192.168.123.1（账号/密码：admin/admin）
            - TF卡自动挂载路径：/mnt/mmc 或 /mnt/sd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
