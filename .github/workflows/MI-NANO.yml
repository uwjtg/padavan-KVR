name: Build MI-NANO (R1CL) Padavan 精简版(SSH/curl/VNT/VPN/EasyTier/LUCKY)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/MI-NANO.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4
        with:
          repository: uwjtg/padavan-KVR
          submodules: true
          fetch-depth: 1

      - name: 2. 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git gawk gcc-multilib flex bison gettext libncurses5-dev libssl-dev zlib1g-dev unzip python3
          sudo apt clean

      - name: 3. 适配NANO硬件（MT7628AN+16MB闪存+64MB RAM）
        run: |
          cd /home/runner/work/padavan-KVR/padavan-KVR/opt/rt-n56u/trunk
          # 替换为MI-NANO对应的内核配置（MT7628AN专用）
          sed -i 's/size_tmp="24M"/size_tmp="16M"/g' configs/boards/MI-NANO/kernel-3.4.x.config
          sed -i 's/size_etc="6M"/size_etc="5M"/g' user/scripts/dev_init.sh

      - name: 4. 精简配置（仅保留目标功能）
        run: |
          cd /home/runner/work/padavan-KVR/padavan-KVR/opt/rt-n56u/trunk
          sed -i '/CONFIG_FIRMWARE_/d' .config
          
          # 基础依赖
          echo "CONFIG_FIRMWARE_ENABLE_IPV6=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" >> .config
          
          # 核心功能
          echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_CURL=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_VNTCLI=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_EASYTIER=y" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_LUCKY=y" >> .config

          # 关闭所有无关功能
          echo "CONFIG_FIRMWARE_ENABLE_USB=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_SMBD=n" >> .config

      - name: 5. 编译固件（BOARD为MI-NANO，MT7628AN专用）
        run: |
          cd /home/runner/work/padavan-KVR/padavan-KVR/opt/rt-n56u/trunk
          ./clear_tree.sh
          ./build_firmware_modify.sh MI-NANO  # 关键：BOARD改为MI-NANO
          mv images/*.trx images/mi-nano_padavan_mt7628an.trx

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MI-NANO-Padavan-MT7628AN
          path: /home/runner/work/padavan-KVR/padavan-KVR/opt/rt-n56u/trunk/images/mi-nano_padavan_mt7628an.trx
          retention-days: 30
