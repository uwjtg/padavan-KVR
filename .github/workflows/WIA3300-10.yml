name: WIA3300-10 固件编译（完整可用版）
on: 
  workflow_dispatch:  # 手动触发编译
permissions:
  contents: write  # 允许发布 Release
env:
  TZ: Asia/Shanghai  # 时区配置
jobs:
  build-firmware:
    runs-on: ubuntu-22.04  # 编译环境
    steps:
      # 步骤1：拉取仓库代码
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤2：安装编译依赖
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
          cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
          pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
          sudo timedatectl set-timezone Asia/Shanghai
          echo "依赖安装完成"

      # 步骤3：安装 UPX 压缩工具
      - name: 安装 UPX 压缩工具
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          install-only: true

      # 步骤4：克隆源码并调整存储配置
      - name: 克隆源码并调整存储配置
        env:
          DEVICE: WIA3300-10
          KERNEL: 3.4
        run: |
          # 克隆源码到编译目录
          git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}.git /opt/rt-n56u
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh  # 下载编译工具链
          mkdir -p /opt/images  # 创建固件输出目录
          echo "源码克隆完成，工具链下载中..."

          # 调整内存/存储配置（适配 WIA3300-10：32MB 闪存 + 256MB 内存）
          sed -i 's/SIZ=0x80000/SIZ=0x500000/g' /opt/rt-n56u/trunk/configs/boards/${DEVICE}/kernel-${KERNEL}.config
          sed -i 's/size_etc="6M"/size_etc="5M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
          sed -i 's/size_tmp="24M"/size_tmp="30M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
          sed -i 's/mtd_part_size=65536/mtd_part_size=14680064/g' /opt/rt-n56u/trunk/user/scripts/mtd_storage.sh
          echo "存储配置调整完成"

          # 自动补全 board.h（若缺失则创建适配版）
          if [ ! -f /opt/rt-n56u/trunk/configs/boards/${DEVICE}/board.h ]; then
            echo "=== 检测到 board.h 缺失，自动创建适配 WIA3300-10 的版本 ==="
            cat > /opt/rt-n56u/trunk/configs/boards/${DEVICE}/board.h <<EOF
#ifndef __BOARD_H__
#define __BOARD_H__
#define FLASH_SIZE 0x2000000  // WIA3300-10：32MB 闪存
#define RAM_SIZE 0x10000000   // WIA3300-10：256MB 内存
#define HW_TYPE "WIA3300-10"  // 设备型号
#define HW_VENDOR "Generic"   // 厂商
#define HW_REV "v1.0"         // 硬件版本
#define HW_GPIO_LED_POWER 0   // 电源灯 GPIO 引脚（默认）
#define HW_GPIO_LED_NETWORK 0 // 网络灯 GPIO 引脚（默认）
#define HW_GPIO_BUTTON_RESET 0// 复位键 GPIO 引脚（默认）
#endif
EOF
          fi

          # 自动复制关键文件到脚本默认读取路径
          cp -f /opt/rt-n56u/trunk/configs/boards/${DEVICE}/kernel-${KERNEL}.config /opt/rt-n56u/trunk/configs/boards/kernel-${KERNEL}.config
          cp -f /opt/rt-n56u/trunk/configs/boards/${DEVICE}/board.h /opt/rt-n56u/trunk/configs/boards/board.h
          echo "关键文件复制完成"

      # 步骤5：编译固件
      - name: 编译固件
        env:
          DEVICE: WIA3300-10
          KERNEL: 3.4
        run: |
          cd /opt/rt-n56u/trunk

          # 验证关键文件是否到位
          echo "=== 验证核心文件 ==="
          ls -l /opt/rt-n56u/trunk/configs/boards/kernel-${KERNEL}.config
          ls -l /opt/rt-n56u/trunk/configs/boards/board.h

          # 加载模板配置
          if [ ! -f configs/templates/${DEVICE}.config ]; then
            echo "错误：模板文件 configs/templates/${DEVICE}.config 未找到！"
            exit 1
          fi
          cp -f configs/templates/${DEVICE}.config .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
          echo "模板配置加载完成"

          # 清除默认配置（避免冲突）
          sed -i '/CONFIG_FIRMWARE_ENABLE_IPV6/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_USB/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_UFSD/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_FAT/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_EXFAT/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_EXT2/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_EXT3/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_EXT4/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_XFS/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_FUSE/d' .config
          sed -i '/CONFIG_FIRMWARE_ENABLE_SWAP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_UVC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_HID/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SERIAL/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_AUDIO/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_XFRM/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_QOS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_IMQ/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_IFB/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_IPSET/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NFSD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NFSC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_CIFS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NTFS_3G/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_LPRD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_U2EC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TCPDUMP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_HDPARM/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_PARTED/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD36/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_WINS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FTPD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_RPL2TP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_EAP_PEAP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DDNS_SSL/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_HTTPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SFTP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DROPBEAR/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSH/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENVPN/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SSWAN/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_XUPNPD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MINIDLNA/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FIREFLY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_CURL/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DOGCOM/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MINIEAP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NAPT66/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_VLMCSD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TTYD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_LRZSZ/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_HTOP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NANO/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_IPERF3/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DUMP1090/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_RTL_SDR/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MTR/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOCAT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_WIREGUARD/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_V2RAY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_XRAY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TROJAN/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SSOBFS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_NPC/d' .config
          sed -i '/CONFIG_FIRMWARE_WEBUI_HIDE_VPN/d' .config

          # 配置核心功能（启用需求功能，禁用冗余）
          ## 基础系统
          echo "CONFIG_FIRMWARE_ENABLE_IPV6=y" >> .config          # 启用 IPv6
          echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> .config          # 启用 USB
          echo "CONFIG_FIRMWARE_ENABLE_SWAP=y" >> .config         # 启用 SWAP
          echo "CONFIG_FIRMWARE_ENABLE_UFSD=n" >> .config         # 禁用 UFSD
          echo "CONFIG_FIRMWARE_ENABLE_FAT=n" >> .config          # 禁用 FAT
          echo "CONFIG_FIRMWARE_ENABLE_EXFAT=n" >> .config        # 禁用 EXFAT
          echo "CONFIG_FIRMWARE_ENABLE_EXT2=n" >> .config         # 禁用 EXT2
          echo "CONFIG_FIRMWARE_ENABLE_EXT3=n" >> .config         # 禁用 EXT3
          echo "CONFIG_FIRMWARE_ENABLE_EXT4=n" >> .config         # 禁用 EXT4

          ## 网络功能
          echo "CONFIG_FIRMWARE_INCLUDE_XFRM=y" >> .config        # 启用 XFRM
          echo "CONFIG_FIRMWARE_INCLUDE_QOS=y" >> .config         # 启用 QOS
          echo "CONFIG_FIRMWARE_INCLUDE_CIFS=y" >> .config        # 启用 CIFS
          echo "CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y" >> .config     # 启用 TCPDUMP
          echo "CONFIG_FIRMWARE_INCLUDE_DDNS_SSL=y" >> .config    # 启用 DDNS SSL
          echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config       # 启用 HTTPS
          echo "CONFIG_FIRMWARE_INCLUDE_SFTP=y" >> .config        # 启用 SFTP
          echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y" >> .config    # 启用 Dropbear
          echo "CONFIG_FIRMWARE_INCLUDE_OPENSSH=y" >> .config     # 启用 OpenSSH
          echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=y" >> .config     # 启用 OpenVPN
          echo "CONFIG_FIRMWARE_INCLUDE_CURL=y" >> .config        # 启用 CURL

          ## 核心需求功能
          echo "CONFIG_FIRMWARE_INCLUDE_FRPC=y" >> .config        # 启用 FRP 客户端
          echo "CONFIG_FIRMWARE_INCLUDE_FRPS=y" >> .config        # 启用 FRP 服务端
          echo "CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y" >> .config   # 启用 WireGuard
          echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config    # 启用 Zerotier
          echo "CONFIG_FIRMWARE_INCLUDE_ALIDDNS=y" >> .config     # 启用 阿里 DDNS
          echo "CONFIG_FIRMWARE_INCLUDE_VNTCLI=y" >> .config      # 启用 VNT 客户端
          echo "CONFIG_FIRMWARE_INCLUDE_VNTS=y" >> .config        # 启用 VNT 服务端
          echo "CONFIG_FIRMWARE_INCLUDE_N2N_V3=y" >> .config      # 启用 N2N V3
          echo "CONFIG_FIRMWARE_INCLUDE_N2N_V3_SUPERNODE=y" >> .config # 启用 N2N V3 超级节点

          ## 工具类功能
          echo "CONFIG_FIRMWARE_INCLUDE_TTYD=y" >> .config        # 启用 TTYD
          echo "CONFIG_FIRMWARE_INCLUDE_LRZSZ=y" >> .config       # 启用 LRZSZ
          echo "CONFIG_FIRMWARE_INCLUDE_HTOP=y" >> .config        # 启用 HTOP
          echo "CONFIG_FIRMWARE_INCLUDE_NANO=y" >> .config        # 启用 NANO
          echo "CONFIG_FIRMWARE_INCLUDE_IPERF3=y" >> .config      # 启用 IPERF3
          echo "CONFIG_FIRMWARE_INCLUDE_MTR=y" >> .config         # 启用 MTR
          echo "CONFIG_FIRMWARE_INCLUDE_SOCAT=y" >> .config       # 启用 SOCAT

          ## 禁用冗余功能
          echo "CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=n" >> .config # 禁用 Transmission
          echo "CONFIG_FIRMWARE_INCLUDE_ARIA=n" >> .config        # 禁用 Aria2
          echo "CONFIG_FIRMWARE_INCLUDE_MINIDLNA=n" >> .config    # 禁用 MiniDLNA
          echo "CONFIG_FIRMWARE_INCLUDE_SMBD=n" >> .config        # 禁用 Samba
          echo "CONFIG_FIRMWARE_INCLUDE_FTPD=n" >> .config        # 禁用 FTPD
          echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n" >> .config # 禁用 Shadowsocks

          echo "功能配置完成，开始编译固件..."
          # 清理编译缓存并编译
          sudo ./clear_tree
          sudo ./build_firmware_modify ${DEVICE} 0

          # 移动固件到输出目录
          mv -f images/*.trx /opt/images/
          cp -f .config /opt/images/${DEVICE}.config
          echo "固件编译完成，输出路径：/opt/images/"

          # 记录编译时间和版本标签
          echo "build_time=$(date '+%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV
          echo "tag=WIA3300-10_$(date '+%Y%m%d')" >> $GITHUB_ENV

      # 步骤6：上传固件为构建产物
      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10_固件_${{ env.build_time }}
          path: /opt/images/*

      # 步骤7：发布固件到 GitHub Release
      - name: 发布固件到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          release_name: WIA3300-10 固件_${{ env.build_time }}
          body: |
            ### 固件信息
            - 设备型号：WIA3300-10
            - 编译时间：${{ env.build_time }}
            - 内核版本：3.4.x
            - 硬件适配：32MB 闪存 + 256MB 内存
            - 启用功能：USB/VNT/N2N V3/FRP/WireGuard/Zerotier/阿里DDNS/TTYD等
          files: /opt/images/*
          token: ${{ secrets.GITHUB_TOKEN }}
